# default broad sweep hyperparameter ranges
elo:
  model: elo
  k:
    min_value: 3.2
    max_value: 320.0

glicko:
  model: glicko
  initial_rating_dev:
    min_value: 10.
    max_value: 1000.0
  c:
    min_value: 0.01
    max_value: 100.0

glicko2:
  model: glicko2
  initial_rd:
    min_value: 20.0
    max_value: 700.0
  initial_sigma:
    min_value: 0.012
    max_value: 0.3
  tau:
    min_value: 0.2
    max_value: 1.2

trueskill:
  model: trueskill
  initial_sigma:
    min_value: 0.8333
    max_value: 83.33
  beta:
    min_value: 0.4166 
    max_value: 41.66
  tau:
    min_value: 0.00833
    max_value: 0.833


melo:
  model: melo
  dimension:
    param_type: list
    options: [1, 5, 10]
  eta_r:
    min_value: 1.6
    max_value: 160.0
  eta_c:
    min_value: 0.01
    max_value: 1.0
